[project]
name = "grid-forecast-extremes"
version = "0.1.0"
description = "How much does observed weather overstate day-ahead electricity demand forecast accuracy on extreme-temperature days?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gfe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
